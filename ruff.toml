# Declare the lint rule set explicitly.
#
# This repository had no ruff configuration, so it inherited whatever defaults
# the ruff installed at CI time happened to have — and the lint command installs
# ruff unpinned (`pip install ruff && ruff check .`). ruff 0.16.0 widened its
# default selection, so the same unchanged code went from 0 findings to 409
# overnight, and the next pull request to touch this repository went red without
# having touched any Python. That was a workflow-only change.
#
# The selection below is exactly what ruff applied by default up to and
# including 0.15.x, so this restores the rule set that was actually in force,
# rather than silencing anything that was previously being enforced.
#
# Widening it is worthwhile and deliberate work: at the time of writing ruff
# 0.16 reports 409 findings here, dominated by UP006/UP045 (pep585/604 type
# annotations, 253), BLE001 (blind except, 36), I001 (import sorting, 23) and
# RUF100 (unused noqa, 14). Roughly 323 are auto-fixable with `ruff check --fix`.
# That belongs in its own change, where the diff can be read on its own terms —
# not smuggled into an unrelated pull request.

[lint]
select = ["E4", "E7", "E9", "F"]
