name: auto-tag-release-push

on:
  push:
    branches:
      - main
      - master

# The reusable auto-tag-release workflow declares workflow-level permissions
# (pull-requests: read for PR-based version detection, actions: write for the
# dispatch job). A reusable workflow cannot request permissions the caller does
# not grant, so omitting these makes the call fail with startup_failure and no
# release tag is created. Mirror the canonical ci-helpers caller.
permissions:
  contents: write
  pull-requests: read
  actions: write

jobs:
  tag:
    uses: nikolareljin/ci-helpers/.github/workflows/auto-tag-release.yml@production
    with:
      # This repository carries a floating production ref and ships
      # scripts/create_production.sh, so it opts into the production move.
      # ci-helpers defaults this to false: calling the workflow buys tagging,
      # and nothing else happens unless asked. Valid under either default.
      update_production_tag: true
      default_branch: main
